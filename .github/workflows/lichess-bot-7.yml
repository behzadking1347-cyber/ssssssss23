name: Lichess Bot 7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lichess-bot-7
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 245
    steps:
      - name: Check the bot token secret
        env:
          BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN_7 }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo ::error::Add a repository secret named LICHESS_BOT_TOKEN_7 in Settings -> Secrets and variables -> Actions
            exit 1
          fi

      - name: Get the project
        uses: actions/checkout@v4

      - name: Get the lichess-bot code
        run: git clone --depth 1 https://github.com/lichess-bot-devs/lichess-bot.git lichess-bot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r lichess-bot/requirements.txt

      - name: Install the chess engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          mkdir -p lichess-bot/engines
          cp /usr/games/stockfish lichess-bot/engines/stockfish
          chmod +x lichess-bot/engines/stockfish
          printf "uci\nquit\n" | lichess-bot/engines/stockfish

      - name: Write the config file with the token
        env:
          BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN_7 }}
        run: |
          sed -i "s/__LICHESS_TOKEN__/$BOT_TOKEN/" config-7.yml
          cp config-7.yml lichess-bot/config.yml

      - name: Check the Lichess token
        env:
          BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN_7 }}
        run: |
          code=$(curl -s -D headers.txt -o account.json -w "%{http_code}" -H "Authorization: Bearer $BOT_TOKEN" https://lichess.org/api/account || true)
          if [ "$code" != "200" ]; then
            echo "::error::the Lichess token is not valid (HTTP $code) - create a new token for this bot account with bot:play, team:write and tournament:write scopes"
            exit 1
          fi
          echo "logged in as $(grep -o '"username":"[^"]*"' account.json | head -1 | cut -d'"' -f4)"
          scopes=$(grep -i '^x-oauth-scopes:' headers.txt | cut -d' ' -f2- | tr -d '\r')
          echo "token scopes: ${scopes:-unknown}"
          if [ -n "$scopes" ] && ! echo "$scopes" | grep -q "team:write"; then
            echo "::warning::this Lichess token has no team:write scope, so team join will be refused"
          fi

      - name: Join the team
        env:
          BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN_7 }}
          TEAM_ID: "nVkpmDGx"
        run: |
          code=$(curl -s -o team.json -w "%{http_code}" -X POST "https://lichess.org/team/$TEAM_ID/join" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "message=Automated bot joining the team for the team battle." || true)
          echo "join team $TEAM_ID -> HTTP $code"; head -c 200 team.json; echo
          case "$code" in
            200|400) echo "team join ok" ;;
            403) echo "::warning::team join refused (HTTP 403) - the Lichess token of this bot needs the team:write scope, or the team only accepts invited members. The bot keeps running but its games will not count for the team." ;;
            404) echo "::warning::team $TEAM_ID was not found - check the team link in the panel." ;;
            *) echo "::warning::team join failed (HTTP $code) - the bot keeps running." ;;
          esac

      - name: Join the tournament
        env:
          BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN_7 }}
          TOURNAMENT_ID: "icuc5Iha"
        run: |
          joined=""
          for attempt in 1 2 3; do
            code=$(curl -s -o join.json -w "%{http_code}" -X POST "https://lichess.org/api/tournament/$TOURNAMENT_ID/join" -H "Authorization: Bearer $BOT_TOKEN" || true)
            echo "join attempt $attempt -> HTTP $code"; head -c 200 join.json; echo
            if [ "$code" = "200" ] || [ "$code" = "400" ]; then joined="yes"; break; fi
            sleep 20
          done
          if [ -z "$joined" ]; then
            echo "::warning::could not join the tournament (HTTP $code) - check the link and the tournament:write scope; in a team battle the bot must be a team member first. The bot keeps running."
          fi

      - name: Play chess
        working-directory: lichess-bot
        run: |
          deadline=$(( $(date +%s) + 13800 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            remaining=$(( deadline - $(date +%s) ))
            timeout --signal=INT --kill-after=120 "$remaining" python lichess-bot.py -v || true
            sleep 10
          done